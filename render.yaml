# Render blueprint — deploy as a Python web service.
# In Render: New + → Blueprint → connect this repo.
services:
  - type: web
    name: ksa-metrology-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
